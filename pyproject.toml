[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eldercouncil"
version = "0.1.0"
description = "Elder Council — a local-first multi-model council harness for high-stakes decisions (risk-gated escalation, consensus tally, hash-chained audit). Eight installable councils (six cyber + a business-decision council + an engineering-team council); BYO-LLM, ships no keys. OWASP-Agentic-aware, NIST-AI-RMF-aligned."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ZenBlue Pty Ltd t/a Cyber Elders" }]
keywords = ["agentic", "council", "governance", "multi-model", "consensus", "risk", "owasp", "nist", "mcp", "claude-code", "opencode", "kiro", "cursor", "copilot", "security", "decision-support", "deliberation", "human-in-the-loop", "risk-governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
orchestrator = ["anthropic>=0.40", "httpx>=0.27"]   # optional BYO-LLM runner (ships NO keys; reads env)
dev = ["pytest>=8.0"]
pdf = ["reportlab==5.0.1"]   # branded PDF generator (tools/build_pdfs.py); pinned for byte-stable CI output
demo = ["pillow>=10"]    # terminal-demo GIF generator (tools/build_demo.py)

[project.scripts]
eldercouncil = "eldercouncil.cli:main"

[project.urls]
Homepage = "https://github.com/Cyber-Elders/elder-council-harness"
Source = "https://github.com/Cyber-Elders/elder-council-harness"
Documentation = "https://github.com/Cyber-Elders/elder-council-harness#readme"
Changelog = "https://github.com/Cyber-Elders/elder-council-harness/blob/main/CHANGELOG.md"
Issues = "https://github.com/Cyber-Elders/elder-council-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["eldercouncil"]
artifacts = [
    "eldercouncil/councils/*.yaml",
    "eldercouncil/lenses.yaml",
    "eldercouncil/council-models.json",
    "eldercouncil/gate-policy.yaml",
    "eldercouncil/config.toml.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
