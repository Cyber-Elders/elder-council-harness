# SPDX-License-Identifier: Apache-2.0
name: Publish to PyPI

# Builds the sdist + wheel and publishes to PyPI when a GitHub Release is *published*.
# Uses PyPI Trusted Publishing (OIDC) — NO API token is stored in the repo.
#
# One-time setup on PyPI (org account) before the first release:
#   pypi.org -> Publishing -> "Add a pending publisher"
#     PyPI project name: eldercouncil
#     Owner:             Cyber-Elders
#     Repository:        elder-council-harness
#     Workflow name:     release.yml
#     Environment:       pypi
# Then publishing is just: cut a GitHub Release (e.g. tag v0.1.0) — this workflow does the rest.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eldercouncil
    permissions:
      id-token: write   # OIDC token for Trusted Publishing (no stored secret)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
