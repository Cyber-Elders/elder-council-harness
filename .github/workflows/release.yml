# Publish `eldercouncil` to PyPI via OIDC Trusted Publishing — NO API tokens.
#
#   * Manual dispatch            -> build, twine check, publish to TestPyPI (rehearsal).
#   * A published GitHub Release -> build, twine check, publish to PyPI.
#
# One-time setup before the first run is in RELEASING.md: register a PyPI (and
# TestPyPI) "pending publisher" for THIS repo + workflow (`release.yml`) + the
# environment name below, and create the GitHub Environments `pypi` / `testpypi`
# (add required reviewers on `pypi` for a human approval gate on the irreversible
# publish). No secret is ever stored — the runner mints a short-lived OIDC token.
name: Release (PyPI)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (manual runs go to TestPyPI only; real PyPI needs a Release)"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build + check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # --strict: fail on ANY long-description rendering warning, so the PyPI
          # project page can never render broken.
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI (rehearsal)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/eldercouncil/
    permissions:
      id-token: write   # OIDC trusted publishing — the ONLY elevated grant; no secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eldercouncil/
    permissions:
      id-token: write   # OIDC trusted publishing — the ONLY elevated grant; no secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Uploads with PEP 740 attestations by default (id-token present). SHA-pinned;
      # Dependabot bumps the pin. If you prefer PyPA's auto-patched ref, use @release/v1.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
